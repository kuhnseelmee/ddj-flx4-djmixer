  <script>
  (() => {
    'use strict';
    const root = document.getElementById('flx4-mixer');

    root.dataset.ready = 'true';
    const q = s => root.querySelector(s);
    const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
    const signed = (n,d=1) => `${n>0?'+':''}${Number(n).toFixed(d)}`;
    const time = n => { n=Math.max(0,Number(n)||0); return `${Math.floor(n/60).toString().padStart(2,'0')}:${Math.floor(n%60).toString().padStart(2,'0')}`; };

    const decks={};
    const demoRate=24000;
    function makeDemo(which) {
      const bpm=124, beat=60/bpm, length=beat*32, samples=new Float32Array(Math.floor(length*demoRate));

    function deckMarkup(k) {

      <div class="transport"><button type="button" class="cursor-interaction" data-action="cue">Cue</button><button type="button" class="cursor-interaction" data-action="setcue">Set cue</button><button type="button" class="play cursor-interaction" data-action="play" aria-pressed="false">▶ Play</button></div>
      <label class="line-label" for="dj-seek-${k}"><span>Track position</span><output data-field="seeklabel">00:00</output></label><input class="cursor-interaction" id="dj-seek-${k}" type="range" min="0" max="1000" step="1" value="0" aria-label="Deck ${k} track position">
      <div class="minor-row"><button type="button" class="cursor-interaction" data-action="back">−1 beat</button><button type="button" class="cursor-interaction" data-action="loop" aria-pressed="false">4-beat loop</button><button type="button" class="cursor-interaction" data-action="forward">+1 beat</button></div>
      <label class="line-label" for="dj-pitch-${k}"><span>Tempo / pitch</span><output data-field="pitchlabel">0.0%</output></label><input class="cursor-interaction" id="dj-pitch-${k}" type="range" min="-16" max="16" step="0.1" value="0" aria-label="Deck ${k} tempo percent">
      <div class="bpm-row"><label for="dj-bpm-${k}">Track BPM</label><input id="dj-bpm-${k}" type="number" min="40" max="240" step="0.1" value="124" aria-label="Deck ${k} manually entered track BPM"><button type="button" class="cursor-interaction" data-action="match">Match ${k==='A'?'B':'A'} BPM</button></div>
      <div class="line-label"><span>Hot cues · tap to set / jump</span></div><div class="pads">${[0,1,2,3].map(n=>`<button type="button" class="pad cursor-interaction" data-hot="${n}" data-set="false" aria-label="Deck ${k} hot cue ${n+1}, unset">${n+1}<span>Empty</span></button>`).join('')}</div>
      <div class="deck-footer"><button type="button" class="cursor-interaction" data-action="repeat" aria-pressed="true">Repeat on</button><button type="button" class="cursor-interaction" data-action="clearcues">Clear cues</button></div>`;
    }
    function channelMarkup(k) {

    }
    for(const k of ['A','B']) {
      const el=q(`[data-deck="${k}"]`);el.innerHTML=deckMarkup(k);q(`[data-channel="${k}"]`).innerHTML=channelMarkup(k);
      decks[k]={k,el,demo:makeDemo(k),buffer:null,source:null,playing:false,offset:0,started:0,rate:1,cue:0,hot:[null,null,null,null],repeat:true,loop:false,loopStart:0,loopEnd:0,loadToken:0,nodes:null,bpm:124,duration:60/124*32,loading:false};
    }
    function field(d,name){return d.el.querySelector(`[data-field="${name}"]`);}
    function btn(d,name){return d.el.querySelector(`[data-action="${name}"]`);}
    function drawWave(d,samples){
      let path=''; const bins=128, stride=Math.max(1,Math.floor(samples.length/bins));
      for(let n=0;n<bins;n++){let peak=0;for(let i=n*stride;i<Math.min(samples.length,(n+1)*stride);i+=Math.max(1,Math.floor(stride/80)))peak=Math.max(peak,Math.abs(samples[i])); const h=Math.max(.9,Math.min(20,peak*32));path+=`M${n*2} ${21-h}h1.3v${h*2}h-1.3Z`;}

    }
    function target(param,value){if(ctx)param.setTargetAtTime(value,ctx.currentTime,.012);}
